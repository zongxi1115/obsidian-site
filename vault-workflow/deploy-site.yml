# 这个文件要放到「笔记仓库」里：obsidian-computer/.github/workflows/deploy-site.yml
# 作用：笔记每次 push 到 main，就去戳一下 Vercel 的 Deploy Hook，让站点重新构建。
name: 触发站点重新构建

on:
  push:
    branches: [main]
    paths-ignore: # 改 Obsidian 配置、改这个 workflow 本身，不用重建站点
      - '.obsidian/**'
      - '.github/**'
  workflow_dispatch: # 也可以在 Actions 页面手动点一次

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 调用 Vercel Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::notice::还没配 VERCEL_DEPLOY_HOOK，本次跳过。到 Vercel → Settings → Git → Deploy Hooks 建一个，再把 URL 存成本仓库的 Actions secret 即可。"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "::notice::已通知 Vercel 重新构建"
